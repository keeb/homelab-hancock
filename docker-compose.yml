version: '3.9'

x-base-logged-service: &base_logged_service
  restart: unless-stopped

x-base-network-config: &base_network_config
  networks: 
   - web

services:
  # grafana stack
  loki:
    <<: *base_network_config
    image: grafana/loki
    container_name: loki
    hostname: loki
    volumes:
      - /storage/02/linux/docker/loki/local-config.yaml:/etc/loki/local-config.yaml
      - /storage/02/linux/docker/loki/data:/loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
    networks:
      web:
        aliases:
          - loki


  promtail:
    <<: [*base_logged_service, *base_network_config]
    image: grafana/promtail
    container_name: promtail
    volumes:
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /storage/02/linux/docker/promtail/config.yml:/etc/promtail/config.yml:ro
      - /storage/02/linux/docker/promtail/positions:/tmp/positions
    command: -config.file=/etc/promtail/config.yml
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'
        reservations:
          memory: 128M

  
  grafana:
    <<: [*base_logged_service, *base_network_config]
    image: grafana/grafana:latest
    container_name: grafana
    user: 1000:1001
    volumes:
      # data
      - /storage/02/linux/docker/grafana/data:/var/lib/grafana
      
      # should implement /etc/grafana/grafana.ini
      - /storage/02/linux/docker/grafana/etc/grafana.ini:/etc/grafana/grafana.ini
      
      # will add datasources later for loki..
      # but this should live outside of container also
      #- /storage/02/linux/docker/grafana/datasource.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.treehouse.local`) || Host(`grafana.treehouse.lan`)"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"


  # mongo stack
  mongo:
    <<: [*base_logged_service, *base_network_config]
    image: mongo:7.0
    ports:
      - 27017:27017
    container_name: mongo
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    command:
      - mongod
      - --replSet
      - rs0
      - --keyFile
      - /etc/mongo-keyfile
      - --auth
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - "4"
    extra_hosts:
      - "hancock:host-gateway"
    volumes:
      - /storage/02/linux/docker/mongodb/db:/data/db
      - /storage/02/linux/docker/mongodb/keyfile:/etc/mongo-keyfile:ro
    environment:
      - MONGO_INITDB_ROOT_USERNAME=treehouse
      - MONGO_INITDB_ROOT_PASSWORD=mongo
    deploy:
      resources:
        limits:
          memory: 24G
        reservations:
          memory: 1G

  mongo-express:
    <<: [*base_logged_service, *base_network_config]
    image: mongo-express:latest
    container_name: express
    depends_on:
      - mongo
    environment:
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
      - ME_CONFIG_MONGODB_ADMINUSERNAME=
      - ME_CONFIG_MONGODB_ADMINPASSWORD=
      - ME_CONFIG_MONGODB_URL=mongodb://treehouse:mongo@mongo:27017/?directConnection=true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mongo-express.rule=Host(`express.treehouse.local`) || Host(`express.treehouse.lan`)"
      - "traefik.http.services.mongo-express.loadbalancer.server.port=8081"

  # prometheus / node-exporter
  node-exporter:
    <<: [*base_logged_service, *base_network_config]
    image: prom/node-exporter
    container_name: node-exporter
    hostname: hancock
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - 9100:9100

  cadvisor: 
    <<: [*base_logged_service, *base_network_config]
    image: gcr.io/cadvisor/cadvisor
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - 8081:8080
  
  prometheus:
    <<: [*base_logged_service, *base_network_config]
    image: prom/prometheus
    user: 1000:1001
    container_name: prometheus
    volumes:
      - /storage/02/linux/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - /storage/02/linux/docker/prometheus/data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.treehouse.local`) || Host(`prometheus.treehouse.lan`)"
  
  # api services
  sg-scrape-api:
     <<: [*base_logged_service, *base_network_config]
     image: api
     container_name: api
     labels:
       - "traefik.enable=true"
       - "traefik.http.routers.sg-scrape-api.rule=Host(`api.treehouse.local`) || Host(`api.treehouse.lan`)"
       - "traefik.http.services.sg-scrape-api.loadbalancer.server.port=2020"
  
  transmission-magnet-uri-downloader:
    <<: [*base_logged_service, *base_network_config]
    image: keeb/transmission-magnet-uri-service
    container_name: transmission-api-service
    ports:
      - 9200:2020
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.transmission.rule=Host(`transmission.treehouse.local`) || Host(`transmission.treehouse.lan`)"
      - "traefik.http.services.transmission.loadbalancer.server.port=2020"
  
  # reverse proxy
  traefik:
    <<: [*base_logged_service, *base_network_config]
    image: traefik:v3.0
    container_name: traefik
    command:
      - --api.dashboard=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`traefik.treehouse.local`) || Host(`traefik.treehouse.lan`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.service=api@internal"


  jellyfin:
    <<: [*base_logged_service, *base_network_config]
    container_name: jellyfin
    image: jellyfin/jellyfin:12.0
    user: 1000:1001
    ports:
      - "8096:8096"
    volumes:
      - /storage/02/linux/docker/jellyfin/config:/config
      - /storage/02/linux/docker/jellyfin/cache:/cache
      - /mnt/nami/media/video/:/media:ro
      - /mnt/nami/media/audio/:/audio:ro
    restart: unless-stopped
    environment:
      - JELLYFIN_FFmpeg__probesize=50000000
      - JELLYFIN_FFmpeg__analyzeduration=50000000
      - JELLYFIN_PublishedServerUrl=jellyfin.treehouse.local
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.treehouse.local`) || Host(`jellyfin.treehouse.lan`)"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]


  localstack:
    container_name: localstack
    <<: [*base_logged_service, *base_network_config]
    image: localstack/localstack
    ports:
      - "4566:4566"

  sabnzbd:
    <<: [*base_logged_service, *base_network_config]
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - DOCKER_MODS=linuxserver/mods:universal-package-install
      - INSTALL_PIP_PACKAGES=pymongo
    volumes:
      - /storage/02/linux/docker/sabnzbd/config:/config
      - /mnt/nami/media/video/staging:/downloads
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sabnzbd.rule=Host(`sabnzbd.treehouse.local`) || Host(`sabnzbd.treehouse.lan`)"
      - "traefik.http.services.sabnzbd.loadbalancer.server.port=8080"

  forgejo:
    <<: [*base_logged_service, *base_network_config]
    image: codeberg.org/forgejo/forgejo:15.0.1
    container_name: forgejo
    environment:
      - USER_UID=1000
      - USER_GID=1001
      - TZ=America/Los_Angeles
    ports:
      - "222:22"
    volumes:
      - /storage/02/linux/docker/forgejo/data:/data
      - /storage/02/linux/docker/forgejo/app.ini:/data/gitea/conf/app.ini
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.forgejo.rule=Host(`forge.treehouse.local`) || Host(`forge.treehouse.lan`)"
      - "traefik.http.services.forgejo.loadbalancer.server.port=3000"

  # re-added to match the already-running container (was dropped from this
  # file but never stopped); reconstructed from `docker inspect registry`
  registry:
    <<: [*base_logged_service, *base_network_config]
    image: registry:2
    container_name: registry
    ports:
      - "5000:5000"
    volumes:
      - /storage/02/linux/docker/registry/data:/var/lib/registry
    environment:
      - REGISTRY_STORAGE_DELETE_ENABLED=true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.registry.rule=Host(`registry.treehouse.local`) || Host(`registry.treehouse.lan`)"
      - "traefik.http.services.registry.loadbalancer.server.port=5000"

networks:
  web:
    external: true
